# Deterministic lint of the agent-instruction files (CLAUDE.md, AGENTS.md, REVIEW.md
# and the skills under .agents/ and .claude/); see .github/scripts/lint_agent_docs.py.
# Semantic review expectations for these files are in REVIEW.md.
name: Agent docs
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    name: Lint agent docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint CLAUDE.md, AGENTS.md and skills
        run: python3 .github/scripts/lint_agent_docs.py
